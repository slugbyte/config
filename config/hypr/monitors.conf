# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Monitor name variables -- update these when switching setups.
$MAIN_MONITOR = DP-1
$TABLET_MONITOR = DP-3

# Default for any secondary monitor (e.g. the tablet): native res, scale 1.
# The primary panel ($MAIN_MONITOR) is set by the active profile sourced
# below; that rule names the output, so it overrides this catch-all.
monitor = , preferred, auto, 1

# Primary display resolution + scale is controlled by `system-4k (on|off)`,
# which swaps which profile active.conf points at, then runs hyprctl reload.
#   system-4k on   -> 4k @ 1.6 scale     (config/hypr/monitor/on.conf)
#   system-4k off  -> default res @ 1x   (config/hypr/monitor/off.conf)
# active.conf is gitignored and seeded by link.sh (default: on).
source = ~/.config/hypr/monitor/active.conf

# rotate main monitor 270 degrees
# monitor = $MAIN_MONITOR, preferred, auto, 1, transform, 3

# workspace 1-3 on main monitor
workspace = 1, monitor:$MAIN_MONITOR, persistent:true
workspace = 2, monitor:$MAIN_MONITOR, persistent:true
workspace = 3, monitor:$MAIN_MONITOR, persistent:true
# workspace 4 on tablet monitor
workspace = 4, monitor:$TABLET_MONITOR, persistent:true

# drawing apps belong on the tablet
windowrule = monitor $TABLET_MONITOR, match:class (com.develop.tablet|com.slugbyte.paint|krita)

# create tag float-center 
windowrule = float on, match:tag float-center
windowrule = center on, match:tag float-center
windowrule = tag +float-center, match:class (com.slugbyte.pic|com.slugbyte.float|com.develop.float)

# create flag float-popup (same as float center but with a set size 1200x1000)
windowrule = tag +float-center, match:tag float-popup
windowrule = size 1200 1000, match:tag float-popup
windowrule = tag +float-popup, match:class (com.slugbyte.popup|com.develop.popup)

# steam and games on workspace 5
windowrule = workspace 5, match:class (steam|factorio)
windowrule = float on, match:class (steam)
windowrule = float off, match:class (steam), match:title Steam

# games in fullscreen
windowrule = fullscreen on, match:class (factorio)
