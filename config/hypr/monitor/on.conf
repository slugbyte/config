# 4k profile -- ASUS PA279CRV 27" at fractional 1.6 scale.
# GDK_SCALE 1.75 pairs with monitor scale 1.6 (Omarchy's recommended 4k combo):
# the compositor sizes everything, so terminal/waybar font sizes stay as-is.
# Activated by `system-4k on`.
monitor = DP-1, 3840x2160@60, 0x0, 1.6
env = GDK_SCALE,1.75
