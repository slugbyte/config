# Non-4k profile -- revert the primary panel to its default mode at 1x scale,
# with no fractional scaling. "preferred" lets the monitor pick its native
# resolution rather than forcing a fixed one. Use for games, screen-sharing,
# or apps that dislike fractional scaling. Activated by `system-4k off`.
monitor = DP-1, preferred, auto, 1
env = GDK_SCALE,1
